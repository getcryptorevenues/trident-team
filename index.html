    radio(){noise('bandpass',2200,1.5,0.12,0.08);tone('square',1250,1250,0.06,0.07,0.08);tone('square',950,950,0.06,0.09,0.17);noise('bandpass',2200,1.5,0.08,0.06,0.3);},

function prof(){if(!save.profile)save.profile={careerXP:0,callsign:'',totals:{played:0,won:0,lost:0,kills:0,shots:0,hits:0,flashes:0,wounded:0,downed:0,alarms:0,time:0,training:0},best:{},runs:[]};return save.profile;}

const campaignScore=()=>MISSIONS.reduce((a,m)=>a+((prof().best[m.id]||{}).score||0),0);
const accPct=t=>t.shots?Math.round(t.hits/t.shots*100):0;
let runStats={shots:0,hits:0,flashes:0};
function scoreRun(win){
  const acc=runStats.shots?runStats.hits/runStats.shots:0,wounded=ops.filter(o=>o.hp>0&&o.hp<o.max).length,down=ops.filter(o=>o.hp<=0).length,kills=ops.reduce((a,o)=>a+o.kills,0);
  const parts=win?{Completion:1000,Speed:Math.round(Math.max(0,1.5-time/M.par)*600),Accuracy:Math.round(acc*400),'Team health':(wounded||down?0:400)-wounded*100-down*250,Stealth:alarm?0:200,Kills:kills*25}:{};
  return{total:Math.max(0,Object.values(parts).reduce((a,b)=>a+b,0)),parts,acc,kills,wounded,down};}
function recordRun(r,sc,stars){const P=prof(),t=P.totals,rk0=rankOf(P.careerXP).i;
  const firstTrain=M.training&&r.win&&!(save.training&&save.training[M.id]);
  const cxp=M.training?(r.win?(firstTrain?60:10):0):(r.win?Math.round(sc.total/10):25);
  P.careerXP+=cxp;
  if(M.training)t.training++;else{t.played++;r.win?t.won++:t.lost++;t.kills+=sc.kills;t.shots+=runStats.shots;t.hits+=runStats.hits;t.flashes+=runStats.flashes;t.wounded+=sc.wounded;t.downed+=sc.down;t.alarms+=alarm?1:0;t.time+=time;}
  const run={id:Date.now().toString(36),at:new Date().toISOString(),mission:M.id,name:M.name,training:!!M.training,win:!!r.win,time:+time.toFixed(1),par:M.par,score:sc.total,parts:sc.parts,
    stars:stars||null,kills:sc.kills,shots:runStats.shots,hits:runStats.hits,flashes:runStats.flashes,wounded:sc.wounded,down:sc.down,alarm:!!alarm,squad:curSquad.slice()};
  let newBest=false;
  if(!M.training&&r.win){const b=P.best[M.id];if(!b||sc.total>b.score){P.best[M.id]={score:sc.total,time:run.time,at:run.at};newBest=true;}}
  P.runs.unshift(run);P.runs=P.runs.slice(0,30);
  return{run,cxp,rankUp:rankOf(P.careerXP).i>rk0,newBest};}

const Cloud=(()=>{let db=null,user=null,uid=null,status='local',timer=null,busy=false,pendingRuns=[];

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function turn(u,target,rate,dt){const d=angDiff(target,u.a),m=rate*dt;u.a+=Math.abs(d)<m?d:Math.sign(d)*m;}
function cell(tx,ty){if(tx<0||ty<0||tx>=W||ty>=H)return '#';return grid[ty][tx];}
function door(tx,ty){return doors[tx+','+ty];}
function blocksMove(tx,ty){const c=cell(tx,ty);return c==='#'||c==='c';}
function blocksLOS(tx,ty,ignoreDoors){const c=cell(tx,ty);if(c==='#'||c==='c')return true;if(c==='D'&&!ignoreDoors)return !door(tx,ty).open;return false;}
function los(x0,y0,x1,y1,ignoreDoors){const dx=x1-x0,dy=y1-y0,n=Math.ceil(Math.hypot(dx,dy)/0.1);for(let i=1;i<n;i++){if(blocksLOS(Math.floor(x0+dx*i/n),Math.floor(y0+dy*i/n),ignoreDoors))return false;}return true;}
function freeAt(x,y){const r=0.22;for(const[a,b]of[[-r,-r],[r,-r],[-r,r],[r,r]])if(blocksMove(Math.floor(x+a),Math.floor(y+b)))return false;return true;}

let curList=MISSIONS;

  const wallish=(x,y)=>{const c=cell(x,y);return c==='#'||c==='D';};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]==='D')doors[x+','+y]={x,y,open:false,horiz:wallish(x-1,y)&&wallish(x+1,y)};
  ops=squad.map((id,i)=>{const m=member(id),st=opStats(m),sp=M.spawns[i];if(!M.training)st.maxHp-=hurtPenalty(m,st.maxHp);
    return{...st,i,id,name:m.name,color:m.color,role:m.role,x:sp[0],y:sp[1],isOp:true,a:-Math.PI/2,hp:st.maxHp,max:st.maxHp,
      path:[],pathIdx:0,waiting:false,busy:0,after:null,tgt:null,react:0,cd:0,stun:0,flashUsed:0,kills:0,revived:false,lead:null,k:0};});

  effects=[];grenades=[];texts=[];time=0;sel=0;multi=new Set([0]);press=null;box=null;mode='draw';drag=null;state='plan';pendingEnd=null;
  $('tName').textContent=M.name;

function noise(x,y,r){
  for(const e of enemies){if(e.hp<=0||e.captured||e.tgt)continue;if(Math.hypot(e.x-x,e.y-y)>r)continue;
    if(!e.alerted)e.alertDelay=0.4;e.alerted=true;e.lkx=x;e.lky=y;}
}
function shoot(s,t,acc){
  s.shotT=performance.now();
  const hit=Math.random()<acc;let ex=t.x,ey=t.y;
  if(!hit){ex+=(Math.random()-.5)*1.4;ey+=(Math.random()-.5)*1.4;}
  effects.push({k:'tracer',x0:s.x+Math.cos(s.a)*0.35,y0:s.y+Math.sin(s.a)*0.35,x1:ex,y1:ey,t:0.09,c:s.isOp?'#fff2b0':'#ff8a6a'});
  effects.push({k:'muzzle',x:s.x+Math.cos(s.a)*0.4,y:s.y+Math.sin(s.a)*0.4,t:0.06});
  if(hit){
    t.hp--;
    if(t.isOp){addText(t.x,t.y-0.5,t.hp<=0?'DOWN':'WOUNDED','#ff6b5a');}
    else{if(t.hp<=0&&s.isOp)s.kills++;addText(t.x,t.y-0.5,t.hp<=0?'DOWN':'HIT',t.hp<=0?'#7ee081':'#ffd34d');t.alerted=true;t.lkx=s.x;t.lky=s.y;}
  }
  if(s.isOp){runStats.shots++;if(hit)runStats.hits++;}
  if(s.isOp)SFX.shotOp();else SFX.shotEnemy();if(hit&&t.isOp)SFX.hitOp();
  noise(s.x,s.y,s.isOp?3.5:6); // operators are suppressed
}
function stunArea(x,y,r,secs,label){
  for(const e of enemies){if(e.hp<=0||e.captured)continue;if(Math.hypot(e.x-x,e.y-y)<=r&&los(x,y,e.x,e.y)){e.stun=Math.max(e.stun,secs);e.tgt=null;e.alerted=true;e.lkx=x;e.lky=y;addText(e.x,e.y-0.5,label,'#ffd34d');}}
}
function openDoor(o,dr){
  dr.open=true;if(o.charge)SFX.breach();else SFX.door();
  if(o.charge){const cx=dr.x+.5,cy=dr.y+.5;effects.push({k:'bang',x:cx,y:cy,t:0.5,r:CHARGE_R});stunArea(cx,cy,CHARGE_R,2.5,'BREACHED');noise(cx,cy,6);}
}
function launchFlash(o,tx,ty){
  const d=Math.hypot(tx-o.x,ty-o.y),n=Math.max(1,Math.ceil(d/0.1));let ex=o.x,ey=o.y;
  for(let i=1;i<=n;i++){const x=o.x+(tx-o.x)*i/n,y=o.y+(ty-o.y)*i/n;if(blocksLOS(Math.floor(x),Math.floor(y)))break;ex=x;ey=y;}
  grenades.push({x0:o.x,y0:o.y,x1:ex,y1:ey,t:0,dur:0.4+d*0.04});
  o.a=Math.atan2(ty-o.y,tx-o.x);o.busy=0.35;addText(o.x,o.y-0.5,'FLASH OUT','#fff');SFX.pin();
}
function throwFlash(o,node){
  runStats.flashes++;
  node.flashDone=true;o.flashUsed++;
  const tx=node.flash.x,ty=node.flash.y,d=Math.hypot(tx-o.x,ty-o.y),n=Math.max(1,Math.ceil(d/0.1));
  for(let i=1;i<=n;i++){const x=o.x+(tx-o.x)*i/n,y=o.y+(ty-o.y)*i/n,cx=Math.floor(x),cy=Math.floor(y);
    if(blocksLOS(cx,cy)){const dr=cell(cx,cy)==='D'?door(cx,cy):null;
      if(dr&&Math.hypot(cx+.5-o.x,cy+.5-o.y)<1.9){o.busy=0.4;o.after=()=>{dr.open=true;SFX.door();launchFlash(o,tx,ty);};return;}
      break;}}
  launchFlash(o,tx,ty);
}
function detonate(g){
  SFX.flashbang();
  effects.push({k:'bang',x:g.x1,y:g.y1,t:0.5,r:FLASH_R});
  stunArea(g.x1,g.y1,FLASH_R,4,'STUNNED');
  for(const o of ops){if(o.hp<=0)continue;if(Math.hypot(o.x-g.x1,o.y-g.y1)<=1.4&&los(g.x1,g.y1,o.x,o.y)){o.stun=1.2;addText(o.x,o.y-0.5,'BLINDED','#ffd34d');}}
  noise(g.x1,g.y1,5);
}

function updOp(o,dt){
  if(o.hp<=0)return;
  if(o.stun>0)o.stun-=dt;
  if(o.revive)for(const t of ops)if(t!==o&&t.hp<=0&&!t.revived&&dist(o,t)<0.9){t.hp=1;t.revived=true;addText(t.x,t.y-0.5,'REVIVED','#7ee081');}
  let tgt=null,best=1e9;
  if(o.stun<=0)for(const e of enemies){if(e.hp<=0||e.hvt)continue;const d=dist(o,e);if(d>11)continue;
    if(Math.abs(angDiff(Math.atan2(e.y-o.y,e.x-o.x),o.a))>o.half&&d>2.2)continue;
    if(!los(o.x,o.y,e.x,e.y))continue;if(d<best){best=d;tgt=e;}}
  if(tgt!==o.tgt){o.tgt=tgt;o.react=(0.22+Math.random()*0.12)*o.reactMul;}
  o.cd-=dt;
  if(tgt){const want=Math.atan2(tgt.y-o.y,tgt.x-o.x);turn(o,want,10,dt);o.react-=dt;
    if(o.react<=0&&o.cd<=0&&Math.abs(angDiff(want,o.a))<0.2){
      let acc=o.acc+leadBonus()+(o.long&&best>5?0.15:0);if(tgt.stun>0)acc=Math.max(acc,0.95);
      shoot(o,tgt,Math.min(0.97,acc));o.cd=o.rof;}}
  if(o.busy>0){o.busy-=dt;if(o.busy<=0&&o.after){const f=o.after;o.after=null;f();}return;}
  if(o.waiting||o.stun>0)return;
  const node=o.path[o.pathIdx];if(!node)return;
  const dx=node.x-o.x,dy=node.y-o.y,d=Math.hypot(dx,dy);
  if(d<0.03){
    if(node.hold&&!node.holdDone){o.waiting=true;return;}
    if(node.flash&&!node.flashDone){throwFlash(o,node);return;}
    o.pathIdx++;return;
  }
  const ux=dx/d,uy=dy/d,cx=Math.floor(o.x+ux*0.45),cy=Math.floor(o.y+uy*0.45);
  if(cell(cx,cy)==='D'&&!door(cx,cy).open){const dr=door(cx,cy);o.busy=o.doorT;o.after=()=>openDoor(o,dr);if(!tgt)o.a=Math.atan2(uy,ux);return;}
  const s=Math.min((tgt?1.1:2.3)*dt,d);o.x+=ux*s;o.y+=uy*s;
  if(!tgt)turn(o,Math.atan2(uy,ux),10,dt);
}
function updEn(e,dt){
  if(e.hp<=0||e.captured)return;
  if(e.stun>0){e.stun-=dt;return;}
  if(e.alerted&&!alarm){e.radioT+=dt;if(e.radioT>=2.5)raiseAlarm(e);}
  let tgt=null,best=1e9;
  for(const o of ops){if(o.hp<=0)continue;const d=dist(o,e);if(d>9.5)continue;
    if(Math.abs(angDiff(Math.atan2(o.y-e.y,o.x-e.x),e.a))>0.9&&d>1.5)continue;
    if(!los(e.x,e.y,o.x,o.y))continue;if(d<best){best=d;tgt=o;}}
  if(tgt!==e.tgt){e.tgt=tgt;if(tgt)e.react=(e.alerted?0.45:0.75)+Math.random()*0.3;}
  e.cd-=dt;
  if(tgt){e.alerted=true;e.alertDelay=0;e.lkx=tgt.x;e.lky=tgt.y;const want=Math.atan2(tgt.y-e.y,tgt.x-e.x);turn(e,want,3.2,dt);e.react-=dt;
    if(e.react<=0&&e.cd<=0&&Math.abs(angDiff(want,e.a))<0.25){shoot(e,tgt,e.hvt?0.25:(M.enemyAcc||0.38));e.cd=0.55+Math.random()*0.25;}}
  else if(e.alertDelay>0)e.alertDelay-=dt;
  else if(e.alerted&&e.lkx!==null)turn(e,Math.atan2(e.lky-e.y,e.lkx-e.x),3,dt);
  else if(e.patrol){const p=e.patrol[e.pi],dx=p[0]-e.x,dy=p[1]-e.y,d=Math.hypot(dx,dy);
    if(d<0.05)e.pi=(e.pi+1)%e.patrol.length;else{const s=Math.min(1.0*dt,d);e.x+=dx/d*s;e.y+=dy/d*s;turn(e,Math.atan2(dy,dx),4,dt);}}
  if(e.exec&&hostage&&e.alerted&&hostage.alive&&!hostage.rescued){e.execT+=dt;
    if(e.execT>=EXEC_TIME){hostage.alive=false;e.a=Math.atan2(hostage.y-e.y,hostage.x-e.x);
      effects.push({k:'tracer',x0:e.x,y0:e.y,x1:hostage.x,y1:hostage.y,t:0.15,c:'#ff8a6a'});addText(hostage.x,hostage.y-0.5,'VIP DOWN','#ff6b5a');}}
}
function raiseAlarm(e){alarm=true;SFX.alarm();alarmAt=time;addText(e.x,e.y-0.6,'ALARM!','#ff6b5a');if(M.obj.escape||M.obj.wipe)toast('Alarm raised — the clock is running');}
function clockLeft(){ // seconds left on this mission's critical clock, or null
  const o=M.obj;
  if(o.type==='defuse'&&!bomb.defused)return bomb.limit-time;
  if(o.escape&&alarm&&!hvtCaptured)return o.escape-(time-alarmAt);
  if(o.wipe&&alarm&&intel.some(i=>!i.got&&!i.wiped)){const t=time-alarmAt-o.wipe.delay;return t<0?-t:o.wipe.every-(t%o.wipe.every);}
  return null;}
function checkObjectives(dt){
  const alive=ops.filter(o=>o.hp>0);
  if(hostage&&hostage.alive&&!hostage.rescued)for(const o of alive)if(dist(o,hostage)<0.9){hostage.rescued=true;addText(hostage.x,hostage.y-0.6,'VIP SECURED','#7ee081');}
  const h=enemies.find(e=>e.hvt);
  if(h&&!hvtCaptured&&h.hp>0)for(const o of alive)if(dist(o,h)<0.9&&(h.stun>0||Math.abs(angDiff(Math.atan2(o.y-h.y,o.x-h.x),h.a))>0.9)){hvtCaptured=true;h.captured=true;h.tgt=null;addText(h.x,h.y-0.6,'HVT CAPTURED','#7ee081');}
  if(bomb&&!bomb.defused){const op=alive.find(o=>dist(o,bomb)<0.8&&!o.tgt);
    if(op){bomb.prog+=dt;if(bomb.prog>=DEFUSE_TIME){bomb.defused=true;addText(bomb.x,bomb.y-0.6,'DEFUSED','#7ee081');}}}
  if(intel&&alarm&&M.obj.wipe){const w=M.obj.wipe,due=time-alarmAt<w.delay?0:Math.floor((time-alarmAt-w.delay)/w.every)+1;let n=intel.filter(i=>i.wiped).length;
    for(const it of intel){if(n>=due)break;if(!it.got&&!it.wiped){it.wiped=true;n++;addText(it.x,it.y-0.5,'WIPED','#ff6b5a');}}}
  if(intel)for(const it of intel)if(!it.got&&!it.wiped)for(const o of alive)if(dist(o,it)<0.7){it.got=true;addText(it.x,it.y-0.5,'INTEL','#5ee6e0');break;}
  if(pendingEnd)return;
  let r=null;
  if(alive.length===0)r={win:false,why:'All operators are down.'};
  else if(hostage&&!hostage.alive)r={win:false,why:'The VIP was executed. Flash the room before the guard reacts.'};
  else if(bomb&&!bomb.defused&&time>=bomb.limit)r={win:false,why:'The bomb went off.'};
  else if(M.obj.escape&&alarm&&!hvtCaptured&&time-alarmAt>=M.obj.escape)r={win:false,why:'The Broker escaped by helicopter. Take out guards fast or stun them before they radio in.'};
  else if(intel&&intel.some(i=>i.wiped))r={win:false,why:'Intel was wiped before you got to it. Silence the guards before they radio in.'};
  else if(M.obj.type==='clear'&&hostiles()===0)r={win:true,why:'All targets down. Well done.'};
  else if(hostage&&hostage.rescued&&hostiles()===0)r={win:true,why:'VIP secured and compound cleared.'};
  else if(M.obj.type==='capture'&&hvtCaptured&&hostiles()===0)r={win:true,why:'The Broker is in custody and the site is clear.'};
  else if(bomb&&bomb.defused)r={win:true,why:'Bomb defused with '+Math.ceil(bomb.limit-time)+' s to spare.'};
  else if(intel&&intel.every(i=>i.got)&&alive.every(o=>o.y>M.obj.extractY))r={win:true,why:'All intel recovered and the team is out.'};
  if(r){r.t=1;pendingEnd=r;}
}
function step(dt){
  time+=dt;
  for(const o of ops)updOp(o,dt);
  for(const e of enemies)updEn(e,dt);
  for(const g of grenades){g.t+=dt;if(g.t>=g.dur){g.done=true;detonate(g);}}
  grenades=grenades.filter(g=>!g.done);
  checkObjectives(dt);
  if(pendingEnd){pendingEnd.t-=dt;if(pendingEnd.t<=0)finish(pendingEnd);}
}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let T=20,ox=0,oy=0,dpr=1,cw=0,ch=0;
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);layers={};cw=r.width;ch=r.height;
  cv.width=Math.max(1,Math.round(cw*dpr));cv.height=Math.max(1,Math.round(ch*dpr));T=Math.min(cw/W,ch/H);ox=(cw-W*T)/2;oy=(ch-H*T)/2;}
function xMark(x,y,c){ctx.strokeStyle=c;ctx.lineWidth=.08;ctx.beginPath();ctx.moveTo(x-.22,y-.22);ctx.lineTo(x+.22,y+.22);ctx.moveTo(x+.22,y-.22);ctx.lineTo(x-.22,y+.22);ctx.stroke();}
function ring(x,y,r,c,w,frac){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();if(frac===undefined)ctx.arc(x,y,r,0,7);else ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+2*Math.PI*frac);ctx.stroke();}
let planView='tac';try{if(localStorage.getItem('trident_view')==='real')planView='real';}catch(_){}
let liveView='3d';try{if(localStorage.getItem('trident_live')==='real')liveView='real';}catch(_){}
const viewNow=()=>(state==='run'||state==='ending')?((liveView==='3d'&&R3D.ready)?'3d':'real'):planView;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// ---- map analysis: indoor rooms, outdoor area, lamp positions ----
let MA=null,layers={},light=null,lctx=null,lampCache={sig:'',polys:[]};
function analyzeMap(){
  const reg=Array.from({length:H},()=>Array(W).fill(-1)),regions=[];
  const open=(x,y)=>{const c=cell(x,y);return c==='.'||c==='c';};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(reg[y][x]<0&&open(x,y)){const id=regions.length,tiles=[],q=[[x,y]];reg[y][x]=id;
    while(q.length){const[a,b]=q.pop();tiles.push([a,b]);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=a+dx,ny=b+dy;if(open(nx,ny)&&reg[ny][nx]<0){reg[ny][nx]=id;q.push([nx,ny]);}}}
    const xs=tiles.map(t=>t[0]),ys=tiles.map(t=>t[1]);regions.push({id,tiles,w:Math.max(...xs)-Math.min(...xs)+1,h:Math.max(...ys)-Math.min(...ys)+1,cx:xs.reduce((a,b)=>a+b,0)/tiles.length+.5,cy:ys.reduce((a,b)=>a+b,0)/tiles.length+.5});}
  const sp=M.spawns[0],outdoor=reg[Math.floor(sp[1])][Math.floor(sp[0])];
  const lamps=[];const R=rng(M.id.length*97);
  for(const r of regions){if(r.id===outdoor)continue;let best=null,bd=1e9;for(const[a,b]of r.tiles){if(cell(a,b)!=='.')continue;const d=Math.hypot(a+.5-r.cx,b+.5-r.cy);if(d<bd){bd=d;best=[a+.5,b+.5];}}
    if(best)lamps.push({x:best[0],y:best[1],r:Math.min(4.8,Math.max(3,Math.sqrt(r.tiles.length)*1.15)),c:R()<.5?'255,190,110':'255,205,140',i:.72+R()*.12,f:R()<.25});}
  for(const k in doors){const d=doors[k];for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=d.x+dx,ny=d.y+dy;if(reg[ny]&&reg[ny][nx]===outdoor&&!lamps.some(l=>Math.hypot(l.x-nx-.5,l.y-ny-.5)<3))lamps.push({x:nx+.5+dx*.3,y:ny+.5+dy*.3,r:4.5,c:'255,225,170',i:.75});}}
  MA={reg,regions,outdoor,lamps};layers={};lampCache={sig:'',polys:[]};
}
const lightSolid=(x,y)=>{const c=cell(x,y);return c==='#'||c==='c'||(c==='D'&&!door(x,y).open);};
function castRay(x0,y0,a,maxR){const dx=Math.cos(a),dy=Math.sin(a);let mx=Math.floor(x0),my=Math.floor(y0);
  const ddx=Math.abs(1/dx),ddy=Math.abs(1/dy),sx=dx<0?-1:1,sy=dy<0?-1:1;
  let sdx=dx<0?(x0-mx)*ddx:(mx+1-x0)*ddx,sdy=dy<0?(y0-my)*ddy:(my+1-y0)*ddy,d=0;
  while(d<maxR){if(sdx<sdy){d=sdx;sdx+=ddx;mx+=sx;}else{d=sdy;sdy+=ddy;my+=sy;}if(lightSolid(mx,my))return Math.min(d+0.28,maxR);}
  return maxR;}
function visPoly(x,y,a0,a1,r,step){const pts=[[x,y]];for(let a=a0;a<=a1+1e-6;a+=step){const d=castRay(x,y,a,r);pts.push([x+Math.cos(a)*d,y+Math.sin(a)*d]);}return pts;}
function polyPath(c,p){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.closePath();}
function lampPolys(){let sig='';for(const k in doors)sig+=doors[k].open?1:0;if(sig!==lampCache.sig){lampCache={sig,polys:MA.lamps.map(L=>visPoly(L.x,L.y,-Math.PI,Math.PI,L.r,1.2*Math.PI/180))};}return lampCache.polys;}
function layer(name,fn){const key=name+'|'+M.id+'|'+Math.round(T*dpr*100);if(!layers[key]){const c=document.createElement('canvas');c.width=Math.ceil(W*T*dpr);c.height=Math.ceil(H*T*dpr);const g=c.getContext('2d');g.setTransform(T*dpr,0,0,T*dpr,0,0);fn(g);layers[key]=c;}return layers[key];}
const isWallT=(x,y)=>cell(x,y)==='#';

function hitTest(p){

  for(const o of ops){if(o.hp<=0)continue;const e=pathEnd(o);if(!e)continue;const d=dist(e,p);if(d<bd){bd=d;best={o,kind:'ext'};}}

  b.innerHTML=avatar(o.id,26)+'<span class="tx"><span class="nm" style="color:'+o.color+'">'+o.name+'</span><span class="hpb"></span><span class="st"></span></span>';
  let t=null,lp=false;
  b.onpointerdown=()=>{lp=false;t=setTimeout(()=>{lp=true;vib(15);if(o.hp<=0)return;if(multi.has(i)&&multi.size>1){multi.delete(i);if(sel===i)sel=[...multi][0];}else{multi.add(i);sel=i;}toast(groupText());},380);};
  b.onpointerup=b.onpointerleave=b.onpointercancel=()=>clearTimeout(t);
  b.oncontextmenu=e=>e.preventDefault();
  b.onclick=()=>{if(lp)return;if(o.hp>0){selectOnly(i);mode='draw';}};c.appendChild(b);o.chip=b;});
  if(ops.length>1){const a=document.createElement('button');a.className='all';a.textContent='ALL';a.onclick=()=>{const al=ops.filter(o=>o.hp>0);if(!al.length)return;multi=new Set(al.map(o=>o.i));if(!multi.has(sel))sel=al[0].i;mode='draw';toast(groupText());};c.appendChild(a);}}
const flashesLeft=o=>o.flashMax-o.flashUsed-plannedFlashes(o);
const mmss=t=>{t=Math.max(0,t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');};
function objText(){
  switch(M.obj.type){
    case 'clear':return 'Hostiles '+hostiles();
    case 'rescue':return 'VIP '+(hostage.rescued?'✓':'·')+' Hostiles '+hostiles();
    case 'capture':return 'HVT '+(hvtCaptured?'✓':'·')+' Hostiles '+hostiles();
    case 'defuse':return bomb.defused?'Bomb ✓':'<span style="color:#ff6b5a">Bomb '+mmss(bomb.limit-time)+'</span>';
    case 'intel':{const n=intel.filter(i=>i.got).length;return 'Intel '+n+'/3'+(n===3?' · Extract':'');}}
}
function refreshUI(){
  if(!inGame()&&state!=='ending')return;
  ops.forEach((o,i)=>{const b=o.chip;b.style.borderColor=multi.has(i)&&o.hp>0?o.color:'#2b3832';b.style.background=multi.has(i)&&o.hp>0?'#1b2621':'';b.classList.toggle('dead',o.hp<=0);
    const hp=Math.max(0,o.hp),fl=o.flashMax-o.flashUsed;
    let bar='';for(let k=0;k<o.max;k++)bar+='<i'+(k<hp?(hp===1?' style="background:#ff6b5a"':''):' class="x"')+'></i>';
    const hb=b.querySelector('.hpb');if(hb.innerHTML!==bar)hb.innerHTML=bar;
    let st='☠'+o.kills+(fl>0?' ✷'+fl:'');
    const badge=o.hp<=0?['DOWN','#ff6b5a']:o.stun>0?['BLIND','#ffd34d']:o.waiting?['HOLD','#ffd34d']:o.tgt?['FIRE','#ff8a6a']:null;
    const html=st+(badge?'<span class="bd" style="background:'+badge[1]+';color:#111">'+badge[0]+'</span>':'');
    const el=b.querySelector('.st');if(el.innerHTML!==html)el.innerHTML=html;});
  const over=time>M.par,tt=$('tTime');tt.textContent=over?'+'+mmss(time-M.par):'PAR '+mmss(M.par-time);tt.style.color=over?'#ff6b5a':'';
  const cl=clockLeft();$('tObj').innerHTML=objText()+(cl!==null&&M.obj.type!=='defuse'?' <span style="color:#ff6b5a">⚠ '+mmss(cl)+'</span>':'');
  const anyWait=ops.some(o=>o.hp>0&&o.waiting);$('bGo').classList.toggle('on',anyWait&&state!=='plan');
  $('bGo').disabled=state==='plan';
  const mb=$('bMain');const lbl=state==='plan'?'EXECUTE ▶':state==='run'?'PAUSE ❚❚':'RESUME ▶';
  if(mb.textContent!==lbl)mb.textContent=lbl;mb.classList.toggle('pause',state==='run');
  $('bFlash').classList.toggle('on',mode==='flash');
}
$('bMain').onclick=()=>{if(state==='plan'||state==='paused')state='run';else if(state==='run')state='paused';mode='draw';};
$('bGo').onclick=()=>{let n=0;for(const o of ops)if(o.hp>0&&o.waiting){o.waiting=false;const nd=o.path[o.pathIdx];if(nd)nd.holdDone=true;n++;}if(n){toast('GO GO GO');SFX.radio();tutF.go=true;}};
const selOps=()=>[...multi].map(i=>ops[i]).filter(o=>o&&o.hp>0);
$('bHold').onclick=()=>{const list=selOps();if(!list.length)return;const pe=pathEnd(ops[sel]);const val=!(pe&&pe.hold&&!pe.holdDone);
  for(const o of list){if(o.lead!==null&&multi.has(o.lead))continue;let node=pathEnd(o);if(!node){node={x:o.x,y:o.y};o.path.push(node);}node.hold=val;node.holdDone=false;syncFollowers(o);}
  toast(val?(list.length>1?'Group holds':list[0].name+' holds')+' at route end until GO':'Hold removed');};
$('bFlash').onclick=()=>{const o=ops[sel];if(!o||o.hp<=0)return;if(mode==='flash'){mode='draw';return;}
  const e=pathEnd(o);if(flashesLeft(o)<=0&&!(e&&e.flash&&!e.flashDone)){toast(o.name+' has no flashbang left');return;}
  mode='flash';};
$('bClear').onclick=()=>{const list=selOps();if(!list.length)return;
  for(const o of list){o.path=[];o.pathIdx=0;o.waiting=false;o.lead=null;for(const f of ops)if(f.lead===o.i){f.lead=null;f.path=[];f.pathIdx=0;f.waiting=false;}}
  mode='draw';toast((list.length>1?'Group':list[0].name)+' route cleared');};

async function showBoard(){state='menu';let tab='overall';
  const render=(list,err)=>{let h='<h1>LEADERBOARD</h1><div class="sub">Trident Team · all players</div>';
    h+='<div class="seg" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">'+['overall'].concat(MISSIONS.map(m=>m.id)).map(id=>'<button data-t="'+id+'" class="'+(tab===id?'big':'sec')+'" style="flex:1;min-width:30%;margin:0;padding:8px 4px;min-height:36px;font-size:11px">'+(id==='overall'?'OVERALL':MISSIONS.find(m=>m.id===id).name.toUpperCase())+'</button>').join('')+'</div>';
    if(err)h+='<div class="card"><p>'+err+'</p></div>';
    else if(!list)h+='<p class="muted">Loading…</p>';
    else{let rows=list.map(p=>({...p,val:tab==='overall'?(p.campaignScore||0):((p.best||{})[tab]||{}).score||0,t:tab==='overall'?null:((p.best||{})[tab]||{}).time})).filter(p=>p.val>0).sort((a,b)=>b.val-a.val);
      if(!rows.length)h+='<p class="muted">No scores yet. Win a mission to get on the board.</p>';
      rows.forEach((p,i)=>{const me=p.id===NET.uid;h+='<div class="stat" style="align-items:center'+(me?';background:#1b2621;border-radius:8px;padding:6px':'')+'"><span><b>'+(i+1)+'.</b> <span class="nm" data-id="'+esc(p.id)+'">'+esc(p.callsign||'')+'</span>'+(me?' <span class="k">(you)</span>':'')+'<br><span class="muted">'+esc(p.rank||'')+' · '+(p.stars||0)+'★'+(p.t?' · '+mmss(p.t):'')+'</span></span><b>'+p.val+'</b></div>';});}
    h+='<p class="muted">Overall = sum of each player\'s best mission scores. Everyone with access to the game appears here; later this becomes the global and friends leaderboard.</p><button class="big" id="lbBack">BACK</button>';
    showOverlay(h);ov.querySelectorAll('button[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render(list,err);});on('lbBack',showMenu);
    const nms=[...ov.querySelectorAll('.nm')].filter(e=>!e.textContent);
    if(nms.length&&NET===Cloud&&Cloud.user&&Cloud.user.profiles)Cloud.user.profiles(nms.map(e=>e.dataset.id)).then(ps=>{nms.forEach(e=>{e.textContent=(ps&&ps[e.dataset.id]&&ps[e.dataset.id].name)||'Operator';});}).catch(()=>nms.forEach(e=>e.textContent='Operator'));
    else nms.forEach(e=>e.textContent='Operator '+String(e.dataset.id).slice(0,4).toUpperCase());};

  catch(_){render(null,'The leaderboard can\'t be reached right now. Try again in a moment.');}
}

  GEAR.forEach((g,i)=>{h+='<div class="gear'+(hasGear(i)?'':' off')+'"><span><b>'+g.n+'</b><br><span class="muted">'+g.d+'</span></span><span>'+(hasGear(i)?'<span class="ok" style="color:#7ee081;font-weight:700">✓</span>':g.s+' ★')+'</span></div>';});
  h+='<button class="sec" id="cTeam" style="margin-top:16px">TEAM</button><button class="sec" id="cBack">MENU</button>';
  showOverlay(h);
  ov.querySelectorAll('.mc').forEach(el=>{const i=+el.dataset.i;if(unlocked(i))el.onclick=()=>showBrief(i);});
  on('cTeam',()=>showTeam(showCampaign));on('cBack',showMenu);
}
function statusOf(m){return m.rest>0?injuryOf(m)+' · '+m.rest+' mission'+(m.rest>1?'s':''):'Ready';}
function showTeam(back){state='menu';
  let h='<h1>TEAM</h1><div class="sub">Trident Team · roster</div>';
  const inj=save.roster.filter(r=>r.rest>0);
  h+='<div class="card"><h2 style="margin-top:0">Medical bay</h2>';
  if(!inj.length)h+='<p class="muted" style="margin:0">Everyone is fit for duty.</p>';
  inj.forEach(r=>{const m=member(r.id),full=opStats(m).maxHp,pen=hurtPenalty(m,full);
    h+='<div class="stat" style="align-items:center"><span style="display:flex;align-items:center;gap:8px">'+avatar(m.id,30)+'<span><b style="color:'+m.color+'">'+m.name+'</b><br><span class="muted">'+injuryOf(m)+' · can play hurt at '+(full-pen)+'/'+full+' HP</span></span></span><b style="white-space:nowrap;margin-left:8px">'+r.rest+' mission'+(r.rest>1?'s':'')+'</b></div>';});
  h+='<p class="muted" style="margin:8px 0 0">Light wound: 1 mission · serious (2+ HP lost or revived): 2 · down: 3. Recovery counts only missions an operator sits out.</p></div>';
  save.roster.forEach(r=>{const m=member(r.id),lv=levelOf(m.xp),pts=pointsOf(m),nx=LEVELS[lv]||null,pv=LEVELS[lv-1];
    const pct=nx?Math.round((m.xp-pv)/(nx-pv)*100):100;
    h+='<div class="oc"><div class="hd"><span style="display:flex;align-items:center;gap:10px">'+avatar(m.id,40)+'<b style="color:'+m.color+'">'+m.name+'</b></span><span class="muted">'+ROLES[m.role]+' · Lv '+lv+'</span></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div><div class="muted">'+m.xp+(nx?' / '+nx:'')+' XP · '+statusOf(m)+(pts>0?' · <span class="k">'+pts+' skill point'+(pts>1?'s':'')+'</span>':'')+'</div>';
    SKILLS[m.role].forEach((sk,j)=>{const inf=SKILL_INFO[sk],req=j+1,own=m.skills.includes(sk);
      let act=own?'<span class="ok">✓</span>':lv<req?'<span class="lk">LV '+req+'</span>':pts>0?'<button data-o="'+m.id+'" data-s="'+sk+'">LEARN</button>':'<span class="lk">—</span>';
      h+='<div class="sk"><div class="d"><b>'+inf.n+'</b><br><span class="muted">'+inf.d+'</span></div>'+act+'</div>';});
    h+='</div>';});
  h+='<button class="big" id="tBack">BACK</button>';
  showOverlay(h);
  ov.querySelectorAll('button[data-s]').forEach(b=>b.onclick=()=>{const r=save.roster.find(x=>x.id===b.dataset.o);r.skills.push(b.dataset.s);store();const y=ov.scrollTop;showTeam(back);ov.scrollTop=y;});
  on('tBack',back);
}
function showBrief(i){state='menu';const m=MISSIONS[i],N=m.squad||4;
  const fit=save.roster.filter(r=>r.rest===0).map(r=>r.id);
  const pick=new Set(fit.slice(0,N));
  const render=()=>{
    let h='<div class="card"><h1>'+m.name.toUpperCase()+'</h1><div class="sub">Mission '+(i+1)+' · '+m.type+' · '+N+' operators</div><p>'+m.brief+'</p><p><span class="k">Objective:</span> '+m.goal+'</p><p><span class="k">Target time:</span> '+mmss(m.par)+' (execution time only; planning and pause don\'t count)'+((save.missions[m.id]||{}).best?' · your best '+mmss(save.missions[m.id].best):'')+'</p>'+(m.critical?'<p>'+m.critical+'</p>':'')+'</div>';
    h+='<h2>Select squad ('+pick.size+'/'+N+')</h2><div class="sq">';
    save.roster.forEach(r=>{const mm=member(r.id),sel=pick.has(r.id),full=opStats(mm).maxHp,pen=hurtPenalty(mm,full);
      const st=r.rest>0?'<span style="color:#ff8a6a">'+injuryOf(mm)+' · plays at '+(full-pen)+'/'+full+' HP</span>':ROLES[mm.role]+' · Ready';
      h+='<button data-o="'+r.id+'" style="display:flex;align-items:center;gap:8px;border-color:'+(sel?mm.color:'#2b3832')+(sel?';background:#1b2621':'')+'">'+avatar(mm.id,34)+'<span><span style="color:'+mm.color+'">'+mm.name+'</span> <span class="muted">Lv '+levelOf(mm.xp)+'</span><small>'+st+'</small></span></button>';});
    h+='</div>';
    if(save.roster.some(r=>r.rest>0))h+='<p class="muted">Injured operators can <b>play hurt</b> with less HP. Playing doesn\'t heal them; only missions they sit out do.</p>';
    if(fit.length===0)h+='<button class="sec" id="bRest">REST THE TEAM (skip one mission)</button>';
    h+='<button class="big" id="bDeploy" '+(pick.size?'':'disabled')+'>DEPLOY</button><button class="sec" id="bBack">BACK</button>';
    showOverlay(h);
    ov.querySelectorAll('.sq button').forEach(b=>b.onclick=()=>{const id=b.dataset.o;if(pick.has(id))pick.delete(id);else if(pick.size<N)pick.add(id);else{toast('Max '+N+' operators on this mission');return;}render();});
    on('bDeploy',()=>{if(pick.size)startMission(i,save.roster.filter(r=>pick.has(r.id)).map(r=>r.id));});
    on('bBack',showCampaign);
    on('bRest',()=>{save.roster.forEach(r=>{r.rest=Math.max(0,r.rest-1);if(!r.rest)r.injury=0;});store();showBrief(i);});
  };render();
}
function finish(r){
  state='ending';SFX.ambient(false);r.win?SFX.win():SFX.lose();tutRender();
  if(M.training){const sc=scoreRun(r.win),rec=recordRun(r,sc,null);NET.queueRun(rec.run);if(r.win){save.training=save.training||{};save.training[M.id]=true;}store();
    const nxt=TRAINING.findIndex(t=>t.id===M.id)+1;
    let h='<div class="card"><h1>'+(r.win?'TRAINING COMPLETE':'TRY AGAIN')+'</h1><div class="sub">'+M.name+'</div><p>'+(r.win?(nxt<TRAINING.length?'Good work. Next up: <b>'+TRAINING[nxt].name+'</b>.':'You know the basics. Time for the real thing: start the <b>Campaign</b>.'):r.why)+'</p>'+
      (rec.cxp?'<p class="k">+'+rec.cxp+' career XP'+(rec.rankUp?' · promoted to '+rankOf(prof().careerXP).name+'!':'')+'</p>':'')+'<p class="muted">Training doesn\'t affect operator XP, injuries or stars.</p></div>';
    if(r.win&&nxt<TRAINING.length)h+='<button class="big" id="trNext">NEXT TRAINING</button>';
    else if(r.win)h+='<button class="big" id="trCamp">START CAMPAIGN</button>';
    h+='<button class="sec" id="trRetry">'+(r.win?'REPLAY':'RETRY')+'</button><button class="sec" id="trMenu">TRAINING MENU</button>';
    showOverlay(h,true);const cm=curMi,sq=curSquad;
    on('trNext',()=>startTraining(nxt));on('trCamp',showCampaign);on('trRetry',()=>startMission(cm,sq,TRAINING));on('trMenu',showTraining);
    return;}
  const fast=r.win&&time<=M.par,clean=r.win&&ops.every(o=>o.hp>=o.max);
  const mrec=save.missions[M.id]||(save.missions[M.id]={complete:false,fast:false,clean:false,won:false});
  const firstWin=r.win&&!mrec.won,before=starsOf(M.id);
  let newBest=false;
  if(r.win){mrec.won=mrec.complete=true;if(fast)mrec.fast=true;if(clean)mrec.clean=true;
    if(!mrec.best||time<mrec.best){newBest=!!mrec.best;mrec.best=+time.toFixed(1);}}
  const gained=starsOf(M.id)-before;
  const sc=scoreRun(r.win),rec=recordRun(r,sc,{complete:!!r.win,fast,clean});NET.queueRun(rec.run);
  const recovery=ops.some(o=>o.recovery);
  const rows=[];
  save.roster.forEach(rr=>{if(!curSquad.includes(rr.id)&&rr.rest>0){rr.rest--;if(!rr.rest)rr.injury=0;}});
  ops.forEach(o=>{const rr=save.roster.find(x=>x.id===o.id),lv0=levelOf(rr.xp);
    const down=o.hp<=0&&!o.revived,lost=down?o.max:o.max-Math.max(0,o.hp);
    const sev=down?3:(o.revived||lost>=2)?2:lost===1?1:0;
    const xp=Math.round((o.kills*20+(r.win?50:15)+(o.hp<=0?0:20))*(fast?1.25:1));rr.xp+=xp;
    let rest=sev;if(recovery&&rest>0)rest--;
    if(rest>=(rr.rest||0)){rr.rest=rest;rr.injury=rest?sev:0;}  // playing hurt doesn't heal, a new wound can make it worse
    rows.push({o,xp,lvUp:levelOf(rr.xp)>lv0,lv:levelOf(rr.xp),status:SEVERITY[sev].replace('Healthy','Unhurt').replace('Critical','Went down'),rest:rr.rest});});
  store();
  const killed=enemies.filter(e=>e.hp<=0).length;
  const chk=(ok,txt)=>'<div class="stat"><span>'+txt+'</span><b style="color:'+(ok?'#ffd34d':'#56645d')+'">'+(ok?'★':'☆')+'</b></div>';
  let h='<div class="card"><h1>'+(r.win?'MISSION SUCCESS':'MISSION FAILED')+'</h1><div class="sub">'+M.name+' · time '+mmss(time)+(newBest&&r.win?' · new best':'')+'</div><p>'+r.why+'</p>'+
    chk(r.win,'Complete the mission')+chk(fast,'Under target time '+mmss(M.par)+(r.win&&!fast?' (+'+mmss(time-M.par)+')':''))+chk(clean,'Nobody wounded')+
    (gained>0?'<p class="k">+'+gained+' new star'+(gained>1?'s':'')+'</p>':'')+(fast?'<p class="k">Fast clear: +25% XP</p>':'')+
    '<div class="stat"><span>Hostiles neutralized</span><b>'+killed+' / '+enemies.filter(e=>!e.hvt).length+'</b></div></div>';
  h+='<div class="card"><div class="stat" style="border:0"><span><b>Mission score</b>'+(rec.newBest?' <span class="k">NEW BEST</span>':'')+'</span><b style="font-size:20px">'+sc.total+'</b></div>';
  for(const k in sc.parts)h+='<div class="stat"><span class="muted">'+k+'</span><span>'+(sc.parts[k]>0?'+':'')+sc.parts[k]+'</span></div>';
  h+='<p class="muted" style="margin:6px 0 0">Accuracy '+Math.round(sc.acc*100)+'% · '+runStats.shots+' shots · '+runStats.flashes+' flashbangs'+(alarm?' · alarm raised':'')+'</p>';
  h+='<p class="k" style="margin:6px 0 0">+'+rec.cxp+' career XP'+(rec.rankUp?' · promoted to '+rankOf(prof().careerXP).name+'!':'')+'</p></div>';
  h+='<h2>Debrief</h2>';
  rows.forEach(x=>{h+='<div class="stat" style="align-items:center"><span style="display:flex;align-items:center;gap:8px">'+avatar(x.o.id,28)+'<span><b style="color:'+x.o.color+'">'+x.o.name+'</b> <span class="muted">'+x.o.kills+' kills · '+x.status+(x.rest?' · rests '+x.rest:'')+'</span></span></span><b>+'+x.xp+' XP'+(x.lvUp?' <span class="lvup">LV '+x.lv+'!</span>':'')+'</b></div>';});
  if(rows.some(x=>x.lvUp))h+='<p class="k" style="margin-top:10px">New skill points — spend them in TEAM.</p>';
  if(firstWin&&curMi+1<MISSIONS.length)h+='<p class="k">Mission '+(curMi+2)+' unlocked: '+MISSIONS[curMi+1].name+'.</p>';
  const newGear=GEAR.filter(g=>totalStars()>=g.s&&!(save.seenGear||[]).includes(g.n));
  if(newGear.length){save.seenGear=(save.seenGear||[]).concat(newGear.map(g=>g.n));store();h+='<p class="k">Gear unlocked: '+newGear.map(g=>g.n).join(', ')+'.</p>';}
  if(r.win&&curMi===MISSIONS.length-1&&firstWin)h+='<p class="k">Deployment 1 complete. More chapters are coming.</p>';
  h+='<button class="big" id="rCont">CONTINUE</button><button class="sec" id="rTeam">TEAM</button>';
  showOverlay(h,true);on('rCont',showCampaign);on('rTeam',()=>showTeam(showCampaign));
}

// =====================================================================
// LOOP
// =====================================================================
let last=performance.now(),uiT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state==='run')step(dt);
  if(effects){for(const f of effects)f.t-=dt;effects=effects.filter(f=>f.t>0);for(const t of texts)t.t-=dt;texts=texts.filter(t=>t.t>0);}
  uiT-=dt;if(uiT<=0){refreshUI();refreshPills();tutTick();uiT=0.1;}
  draw();requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);
resize();showMenu();requestAnimationFrame(frame);
</script>
